<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tickets</title>    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>tickets</h1>
        <div class="lookup">
          <label for="access-key">Chave de acesso (NF-e)</label>
          <div class="key-row">
            <input
              id="access-key"
              form="add-group"
              name="accessKey"
              inputmode="numeric"
              placeholder="44 dígitos"
            />
            <button type="button" id="lookup-nfe">Consultar</button>
          </div>
        </div>
        <div class="actions">
          <button id="auto-arrange" type="button">Auto-organizar</button>
          <button id="print" type="button" class="primary">Imprimir lote</button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
      </header>
      <main>
        <section id="board-panel" aria-label="Prancheta">
          <div id="sheet-tabs" role="tablist" aria-label="Folhas"></div>
          <div id="board" tabindex="-1"></div>
        </section>
        <aside>
          <form id="add-group" autocomplete="off">
            <h2>Nova remessa</h2>
            <label
              >Chave de acesso (NF-e)
              <div class="key-row">
                <input name="accessKey" inputmode="numeric" placeholder="44 dígitos" />
                <button type="button" id="lookup-nfe">Consultar</button>
              </div>
            </label>
            <label>Projeto <input name="project" required list="project-options" /></label>
            <datalist id="project-options"></datalist>
            <label>Município <input name="destination" list="municipio-options" /></label>
            <datalist id="municipio-options"></datalist>
            <label>Volumes <input name="totalVolumes" type="number" min="1" max="100000" step="1" required /></label>
            <label>Número da NF-e <input name="nfeNumber" placeholder="opcional" /></label>
            <label>Lote(s) <input name="batchCodes" placeholder="B23L0947, B23L0948 (opcional)" /></label>
            <label>ID do grupo (opcional) <input name="id" /></label>
            <button type="submit" class="primary">Adicionar à fila</button>
          </form>
          <section aria-label="Grupos na fila">
            <h2>Fila</h2>
            <ul id="groups"></ul>
          </section>
          <section aria-label="Lotes impressos">
            <h2>Impressos</h2>
            <ul id="batches"></ul>
          </section>
        </aside>
      </main>
      <footer>
        <div id="overview" aria-label="Visão geral"></div>
      </footer>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
