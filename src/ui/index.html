<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tickets</title>    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>tickets</h1>
        <div class="actions">
          <button id="auto-arrange" type="button">Auto-organizar</button>
          <button id="print" type="button" class="primary">Imprimir lote</button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
        <div class="lookup">
          <label for="access-key">Chave de acesso (NF-e)</label>
          <div class="key-row">
            <input
              id="access-key"
              form="add-group"
              name="accessKey"
              inputmode="numeric"
              placeholder="44 dígitos"
            />
            <button type="button" id="lookup-nfe">Consultar</button>
          </div>
        </div>
      </header>
      <main>
        <section id="board-panel" aria-label="Prancheta">
          <div id="sheet-tabs" role="tablist" aria-label="Folhas"></div>
          <div id="board" tabindex="-1"></div>
        </section>
        <aside>
          <form id="add-group" autocomplete="off">
            <h2>Nova remessa</h2>
            <div class="combo-field">
              <label for="project-input">Projeto</label>
              <div class="combo">
                <input
                  id="project-input"
                  name="project"
                  required
                  autocomplete="off"
                  role="combobox"
                  aria-expanded="false"
                  aria-autocomplete="list"
                  aria-controls="project-list"
                />
                <ul id="project-list" class="combo-list" role="listbox" hidden></ul>
              </div>
            </div>
            <div class="combo-field">
              <label for="municipio-input">Município</label>
              <div class="combo">
                <input
                  id="municipio-input"
                  name="destination"
                  autocomplete="off"
                  role="combobox"
                  aria-expanded="false"
                  aria-autocomplete="list"
                  aria-controls="municipio-list"
                />
                <ul id="municipio-list" class="combo-list" role="listbox" hidden></ul>
              </div>
            </div>
            <label>Volumes <input name="totalVolumes" type="number" min="1" max="100000" step="1" required /></label>
            <label>Número da NF-e <input name="nfeNumber" placeholder="opcional" /></label>
            <label>Lote(s) <input name="batchCodes" placeholder="B23L0947, B23L0948 (opcional)" /></label>
            <label>ID do grupo (opcional) <input name="id" /></label>
            <button type="submit" class="primary">Adicionar à fila</button>
          </form>
          <section aria-label="Grupos na fila">
            <h2>Fila</h2>
            <ul id="groups"></ul>
          </section>
          <section aria-label="Lotes impressos">
            <h2>Impressos</h2>
            <ul id="batches"></ul>
          </section>
        </aside>
      </main>
      <footer>
        <div id="overview" aria-label="Visão geral"></div>
      </footer>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
